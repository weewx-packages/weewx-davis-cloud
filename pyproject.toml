[tool.pytest.ini_options]
pythonpath = ["bin"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
# Empty mutable containers are typed through Google docstrings, as in WeeWX.
disable_error_code = ["var-annotated"]

[tool.coverage.run]
source = ["user.daviscloud"]

[tool.coverage.report]
show_missing = true
