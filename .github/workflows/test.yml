name: Davis cloud compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '57 3 * * 4'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
        core: [master, development]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weewx/weewx
          ref: ${{ matrix.core }}
          path: _core
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./_core pytest pytest-cov mypy ruff requests six
      - run: python -m ruff check bin install.py tests tools
      - run: python -m mypy bin install.py tools
      - run: python -m pytest -q --cov=user.daviscloud --cov-report=term-missing
      - name: Compare the pinned existing implementations
        run: python tools/oracle_probe.py --download --output verification/oracles.json
